---
esphome:
  name: '${device_id}'
  friendly_name: '${device_name}'
  area: '${device_area}'
  min_version: '2026.7.0'

api:
  encryption:
    key: !secret 'api.encryption.key'

# Diagnostics. `reset_reason` is the only record of *why* a device rebooted that
# survives the reboot, and `loop_time` catches a blocked main loop before the
# watchdog does.
debug: {}

logger:
  level: 'DEBUG'
  logs: {}

network: {}

ota:
  platform: 'esphome'
  password: !secret 'ota.password'

time:
  - platform: 'homeassistant'
  - platform: 'sntp'

binary_sensor:
  - platform: 'status'
    name: 'Status'

button:
  - platform: 'shutdown'
    name: 'Shutdown'
    disabled_by_default: true
  - platform: 'safe_mode'
    name: 'Safe Mode'
    disabled_by_default: true
  - platform: 'restart'
    name: 'Restart'
    id: 'button_restart'

select:
  - platform: 'logger'
    name: 'Log Level'

sensor:
  - platform: 'uptime'
    name: 'Uptime'
  - platform: 'debug'
    free:
      name: 'Free Heap'
    block:
      name: 'Heap Max Block'
    loop_time:
      name: 'Loop Time'

text_sensor:
  - platform: 'debug'
    device:
      name: 'Device Info'
    reset_reason:
      name: 'Reset Reason'
